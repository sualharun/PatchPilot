services:
  redpanda:
    image: redpandadata/redpanda:v24.3.1
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: patchpilot
      POSTGRES_PASSWORD: patchpilot
      POSTGRES_DB: patchpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  patchpilot-migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${PATCHPILOT_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://patchpilot:patchpilot@postgres:5432/patchpilot
      AGENT_LOGS_DIR: /data/logs
      ARTIFACT_STORAGE_DIR: /data/artifacts
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    command: ["agent", "migrate"]
    volumes:
      - patchpilot-data:/data

  patchpilot:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      patchpilot-migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - ${PATCHPILOT_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://patchpilot:patchpilot@postgres:5432/patchpilot
      AGENT_LOGS_DIR: /data/logs
      ARTIFACT_STORAGE_DIR: /data/artifacts
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    command: ["agent", "dashboard", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - patchpilot-data:/data

  patchpilot-worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      patchpilot-migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
    env_file:
      - ${PATCHPILOT_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://patchpilot:patchpilot@postgres:5432/patchpilot
      AGENT_LOGS_DIR: /data/logs
      ARTIFACT_STORAGE_DIR: /data/artifacts
      PATCHPILOT_WORKER_ID: docker-worker-1
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    command: ["agent", "worker", "--limit", "1", "--loop", "--sleep-seconds", "5"]
    volumes:
      - patchpilot-data:/data
      - /var/run/docker.sock:/var/run/docker.sock

  patchpilot-pr-worker:
    build: .
    depends_on:
      redpanda:
        condition: service_healthy
      patchpilot-migrate:
        condition: service_completed_successfully
    env_file:
      - ${PATCHPILOT_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://patchpilot:patchpilot@postgres:5432/patchpilot
      AGENT_LOGS_DIR: /data/logs
      ARTIFACT_STORAGE_DIR: /data/artifacts
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    command: ["agent", "pr-worker", "--limit", "1", "--loop", "--sleep-seconds", "5"]
    volumes:
      - patchpilot-data:/data

volumes:
  postgres-data:
  patchpilot-data:
