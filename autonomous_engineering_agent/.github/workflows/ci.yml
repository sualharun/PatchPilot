name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Prepare CI env
        run: cp .env.ci.example .env
      - name: Ruff
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest
      - name: CLI doctor without Docker daemon requirement
        run: agent --help && agent eval --help && agent dashboard --help && agent doctor --help
      - name: Compose config
        run: docker compose config >/tmp/patchpilot-compose.yml
      - name: Synthetic eval smoke
        run: agent eval-synthetic --manifest evals/synthetic/python_bugs.yaml --output /tmp/synthetic-eval-report.json --env-file .env
