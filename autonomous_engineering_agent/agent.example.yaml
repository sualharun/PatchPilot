install_commands:
  - python -m pip install --upgrade pip
  - python -m pip install -e .
test_commands:
  - python -m pytest
sandbox:
  image: python:3.11-slim
  cpu_limit: "2"
  memory_limit: 2g
  network: bridge
  install_timeout_seconds: 600
  test_timeout_seconds: 600
  command_timeout_seconds: 300
  allowed_commands:
    - python
    - python3
    - pip
    - pytest
    - coverage
    - tox
    - nox
    - poetry
    - pipenv
    - unittest
    - make
logs_dir: .agent-logs
database_url: sqlite:///agent_runs.sqlite3
