install_commands:
  - python -m pip install --upgrade pip
  - python -m pip install -e .
test_commands:
  - python -m pytest
# NOTE: a `sandbox:` block here (image, network, allowed_commands, resource limits) is
# intentionally ignored when this file lives inside a *target* repository the agent is
# fixing issues in -- the sandbox's network access and command allowlist are a
# deployment-controlled security boundary, not something an untrusted repo can loosen by
# editing its own agent.yaml. Configure sandbox settings via the deployment's own
# agent.yaml/environment variables instead (see README.md's "agent.yaml" section and
# SECURITY.md).
logs_dir: .agent-logs
database_url: sqlite:///agent_runs.sqlite3
